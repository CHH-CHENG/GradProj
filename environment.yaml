# =========================================================
# 项目 conda 环境定义（西班牙 IFN4 森林蓄积量估测）
# =========================================================
# 用法：
#   ① 直接使用项目本地环境（当前已就绪）：
#        conda activate E:\GradProj\ProjCode\.conda
#   ② 在新机器上复现环境：
#        conda env create -f environment.yaml
#
# 说明：依赖以 pip 形式声明。其中 rasterio 官方 wheel 自带 GDAL（3.12.4）
#       与 JP2OpenJPEG 驱动，已实测可解码 Sentinel-2 JP2 波段
#       —— 因此无需另行安装 libgdal-jp2openjpeg。
# =========================================================
name: ProjCode
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      # --- 科学计算 / 机器学习 ---
      - numpy==2.5.3
      - pandas==3.0.6
      - scipy==1.18.1
      - scikit-learn==1.9.1
      - xgboost==3.4.1
      - lightgbm==4.7.0
      - shap==0.52.0
      - scikit-image==0.26.0        # GLCM 纹理特征
      - matplotlib==3.11.2
      - joblib==1.6.0
      # --- 遥感 / 空间数据 ---
      - rasterio==1.5.1             # 自带 GDAL + JP2OpenJPEG 驱动
      - geopandas==1.1.4
      - shapely==2.1.2
      - pyproj==3.8.0
      - pyogrio==0.13.0
      # --- 数据读取 / 网络 ---
      - pyodbc==5.3.0               # 读取 IFN4 的 .accdb
      - pyyaml==6.0.3
      - requests==2.32.4
