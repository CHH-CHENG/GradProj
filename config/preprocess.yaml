# =========================================================
# 预处理配置：波段读取 / 重采样 / ROI 裁剪
# =========================================================

# 产品类型：L2A（地表反射率，推荐）/ L1C（TOA，当前仅完整支持 L2A）
product_type: L2A

# 统一重采样分辨率（m）
target_resolution: 10

# 参与建模的波段（20m/60m 波段会重采样到 target_resolution）
bands:
  - B02
  - B03
  - B04
  - B05
  - B06
  - B07
  - B08
  - B8A
  - B11
  - B12

# L2A 反射率存储为 DN(0~10000)，缩放为 0~1 浮点反射率
scale_reflectance: true

# =========================================================
# 研究区（西班牙 IFN4 · León 优先）
# ⚠️ 中心点为初步占位（León 省北部 Cordillera Cantábrica 林区），
#    最终范围待样地分布统计后确定并调整；详见 config/spain_study.yaml
# =========================================================
research_center:
  lon: -6.17
  lat: 42.87

# 研究区半宽（米）→ 最终范围为 2*half_size x 2*half_size
research_half_size_m: 10000

# =========================================================
# 按样地裁剪（预留接口，plots 文件就位后自动启用）
# =========================================================
# 样地矢量文件：点（自动按 plot_buffer_m 缓冲）或面
# ⏳ 西班牙样地需由 IFN4 accdb（PCParcelas + PCDatosMap）导出为 GeoJSON
plots: data/inventory/IFN4/plots_spain.geojson

# 样地点缓冲半径（米）
plot_buffer_m: 20
